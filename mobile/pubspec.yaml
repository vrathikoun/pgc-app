name: pgc_app
description: Application de gestion de club de sport de combat
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  http: ^1.2.1
  # Stockage local du JWT
  flutter_secure_storage: ^9.0.0
  # Gestion d'état
  provider: ^6.1.2
  # Navigation
  go_router: ^13.2.0
  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  # Upload photo
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  youtube_player_flutter: ^9.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/coaches/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true

  image_path_android: "assets/icons/PGC_removebg.png"
  adaptive_icon_background: "#123B1E"
  adaptive_icon_foreground: "assets/icons/PGC_removebg.png"

  image_path_ios: "assets/logo_ios.png"