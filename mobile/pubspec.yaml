name: pgc_app
description: Application de gestion de club de sport de combat
publish_to: 'none'
version: 1.3.3+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  http: ^1.2.1
  # Stockage local du JWT
  flutter_secure_storage: ^9.0.0
  # Gestion d'état
  provider: ^6.1.2
  # Navigation
  go_router: ^13.2.0
  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  # Upload photo
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  youtube_player_flutter: ^9.0.0
  url_launcher: ^6.3.1
  # Push notifications (Firebase Cloud Messaging)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  # Contrôle d'accès par QR code.
  # flutter_zxing décode via ZXing (C++), sans pods Google → pas de conflit
  # GoogleDataTransport avec Firebase (contrairement à mobile_scanner/MLKit).
  qr_flutter: ^4.1.0
  flutter_zxing: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  # Le projet iOS est géré via CocoaPods (Podfile) — on désactive la
  # résolution Swift Package Manager pour des builds reproductibles.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/coaches/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true

  image_path_android: "assets/icons/PGC_removebg.png"
  adaptive_icon_background: "#123B1E"
  adaptive_icon_foreground: "assets/icons/PGC_removebg.png"

  image_path_ios: "assets/logo_ios.png"
  # L'App Store refuse les icônes avec canal alpha → aplatissement sur le vert PGC.
  remove_alpha_ios: true
  background_color_ios: "#123B1E"